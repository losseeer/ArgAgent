# 一键起 backend + frontend + chroma（§4 / §9.1）。
# 所有 key 都可空：空 .env 也必须能起来（§13.2 P1 验收）。
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    volumes:
      - ./data:/srv/data
    extra_hosts:
      # 让容器内的 Ollama 回退链能打到宿主机（§6.5 tier1）
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/api/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      chroma:
        condition: service_started

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:${BACKEND_PORT:-8010}
    ports:
      - "${FRONTEND_PORT:-3005}:3005"
    depends_on:
      backend:
        condition: service_healthy

  chroma:
    # tag 未能在本网络核实（auth.docker.io 不可达）；拉不到只改这一行（§5.2 唯一未验项）
    image: chromadb/chroma:1.5.9
    ports:
      - "${CHROMA_PORT:-8011}:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
