# CI：契约与台账回归（规则回归 + 状态字段/端点契约静态断言），每次 PR 跑
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      # 契约静态断言：DebateState/DebateConfig 字段与契约集合相等、14 个契约端点齐备、请求体拒收身份字段
      - run: uv run pytest tests/unit
      - run: uv run ruff check app tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
