[project]
name = "debate-arena-backend"
version = "0.1.0"
description = "Debate Arena backend: LangGraph debate agent with claim ledger and contradiction detection"
requires-python = ">=3.12"
# 版本代际来自 2026-09-22 的逐版本核查（§13.2 P1 门禁：不得拿 2024 代际硬编码）。
# §5.2 的基线块仍是旧代际，差异与升代结论待 Q21 拍板后同步。
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.53,<0.54",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.15,<3",
  "langgraph>=1.2,<2",
  "langchain-core>=1.6,<2",
  "sqlalchemy>=2.0,<2.1",
  "aiosqlite>=0.22,<0.23",
  "chromadb>=1.5,<2",
  "onnxruntime>=1.30,<2",
  "tavily-python>=0.8,<0.9",
  "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
